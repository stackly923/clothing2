<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store Admin Dashboard | STACKLY</title>
    <meta
      name="description"
      content="Store Admin Dashboard. Explore considered clothing, fit guidance and everyday style at STACKLY."
    />
    <meta property="og:title" content="Store Admin Dashboard | STACKLY" />
    <meta
      property="og:description"
      content="Discover the STACKLY clothing store demonstration."
    />
    <meta
      property="og:url"
      content="https://stackly-clothing-store.dineshsaripirala.chatgpt.site/admin-dashboard.html"
    />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/alignment.css" />

    <style>
      /* Sidebar scrollbar - same theme colour */

.dashboard-sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.dashboard-sidebar nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 6px;

    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
}

/* Chrome / Edge / Safari */
.dashboard-sidebar nav::-webkit-scrollbar {
    width: 6px;
}

.dashboard-sidebar nav::-webkit-scrollbar-track {
    background: transparent;
}

.dashboard-sidebar nav::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 20px;
}

.dashboard-sidebar nav::-webkit-scrollbar-thumb:hover {
    background: var(--ink);
}

.dashboard-sidebar nav::-webkit-scrollbar-corner {
    background: transparent;
}


/* Mobile */
@media (max-width: 768px) {

    .dashboard-sidebar {
        position: relative;
        top: auto;
        height: auto;
        max-height: none;
        overflow: visible;
    }

    .dashboard-sidebar nav {
        max-height: 55vh;
        overflow-y: auto;
        overflow-x: hidden;
    }
}
    </style>
  </head>
  <body data-page="admin-dashboard">
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <div class="dashboard" data-role="admin">
        <aside class="dashboard-sidebar">
          <a class="dashboard-brand" href="index.html" aria-label="STACKLY home"><img class="brand-logo" src="images/stackly-logo-black.webp" alt="STACKLY" width="180" height="60"></a>
          <p class="eyebrow">STORE STUDIO</p>
          <h2>The bigger picture.</h2>
          <button type="button" class="dashboard-menu outline" aria-expanded="true" aria-controls="dashboard-navigation" aria-label="Close dashboard menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <nav id="dashboard-navigation" aria-label="Dashboard">
            <button data-panel="overview">Overview</button
            ><button data-panel="orders">Orders</button
            ><button data-panel="products">Products</button
            ><button data-panel="inventory">Inventory</button
            ><button data-panel="customers">Customers</button
            ><button data-panel="analytics">Analytics</button
            ><button data-panel="reports">Reports</button
            ><button data-panel="messages">Messages</button
            ><a class="text-link" href="index.html">Back to Store</a
            ><button data-logout>Logout</button>
          </nav>
        </aside>
        <div class="dashboard-main">
          <p class="eyebrow">FRONTEND DEMONSTRATION</p>
          <h1>Store overview.</h1>
          <p id="session-email"></p>
          <div class="notice">
            Sample clothing records and analytics. Changes apply only in this
            browser. No real authentication or order fulfilment.
          </div>
          <div id="dashboard-panel"></div>
        </div>
      </div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="search-dialog">
      <div class="dialog-heading">
        <h2>Find your next favourite</h2>
        <button data-close aria-label="Close search">×</button>
      </div>
      <label for="global-search">Search clothing</label
      ><input
        id="global-search"
        type="search"
        placeholder="Try linen, dress, or denim"
      />
      <div id="search-results" class="search-results"></div>
    </dialog>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
