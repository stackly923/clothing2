<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account | STACKLY</title>
    <meta
      name="description"
      content="Create Account. Explore considered clothing, fit guidance and everyday style at STACKLY."
    />
    <meta property="og:title" content="Create Account | STACKLY" />
    <meta
      property="og:description"
      content="Discover the STACKLY clothing store demonstration."
    />
    <meta
      property="og:url"
      content="https://stackly-clothing-store.dineshsaripirala.chatgpt.site/register.html"
    />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/alignment.css" />
  </head>
  <body data-page="register">
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <section class="auth-layout">
        <a class="auth-back" href="index.html"><span aria-hidden="true">&larr;</span> Back to Home</a>
        <div class="auth-panel">
          <a class="logo auth-brand" href="index.html"><img class="brand-logo" src="images/stackly-logo-black.webp" alt="STACKLY" width="180" height="60"></a>
          <h1>Create your account.</h1>
          <p>A thoughtful wardrobe starts here.</p>
          <form data-form="register" novalidate>
            <div class="field">
              <label for="fullName">Full Name *</label
              ><input
                id="fullName"
                name="fullName"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
                required
                aria-describedby="fullName-error"
              /><span class="field-error" id="fullName-error"></span>
            </div>
            <div class="field">
              <label for="email">Email Address *</label
              ><input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
                aria-describedby="email-error"
              /><span class="field-error" id="email-error"></span>
            </div>
            <div class="field">
              <label for="phone">Phone Number *</label
              ><input
                id="phone"
                name="phone"
                type="tel"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
                aria-describedby="phone-error"
              /><span class="field-error" id="phone-error"></span>
            </div>
            <div class="field">
              <label for="password">Password *</label
              ><input
                id="password"
                name="password"
                type="password"
                placeholder="Create a password (at least 8 characters)"
                autocomplete="new-password"
                required
                aria-describedby="password-error"
              /><span class="field-error" id="password-error"></span>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm Password *</label
              ><input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
                aria-describedby="confirmPassword-error"
              /><span class="field-error" id="confirmPassword-error"></span>
            </div>
            <p class="auth-forgot"><a href="404.html">Forgot password?</a></p>
            <div class="field">
              <label for="role">Role *</label>
              <select id="role" name="role" required aria-describedby="role-error">
                <option value="" disabled selected hidden>Role</option>
                <option value="customer">Customer</option>
                <option value="admin">Store Admin</option>
              </select>
              <span class="field-error" id="role-error"></span>
            </div>
            <button class="full">Create demo account</button>
            <p class="feedback" role="status"></p>
          </form>
          <p>
            Already have a demo account?
            <a class="text-link" href="signin.html">Sign In</a>
          </p>
        </div>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="search-dialog">
      <div class="dialog-heading">
        <h2>Find your next favourite</h2>
        <button data-close aria-label="Close search">×</button>
      </div>
      <label for="global-search">Search clothing</label
      ><input
        id="global-search"
        type="search"
        placeholder="Try linen, dress, or denim"
      />
      <div id="search-results" class="search-results"></div>
    </dialog>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
